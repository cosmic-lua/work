name: board

# This repository carries the board and the machinery that moves
# every work item — its own history, separate from cosmic-lua/cosmic,
# so this lane is this repo's whole CI, not a branch-scoped slice of
# cosmic's. It gates what it can gate: the whole `--make ci` (fmt,
# check, lint, coverage-with-tests) over this repo's tree.
#
# The gate is cheap here — a few seconds of tests plus the pinned
# cosmic download — so this lane skips cosmic's fence, cache and
# fixpoint lanes. There is no artifact to reproduce: this job builds
# no binary.
on:
  push:
    branches: [main]
  # Every pull request, whatever its base: a change stacked on another
  # branch is gated the same as one against main.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    # A green run takes well under a minute; anything near this is a hang.
    timeout-minutes: 10
    # This job IS the .cosmic-coverage recording environment for this
    # repo (see README.md). The refusal itself ships from
    # cosmic-lua/cosmic's `main`'s `_make/policy.tl`, embedded in
    # whatever release `bin/cosmic.pin` resolves to here — this marker
    # is inert until that pin carries it, and load-bearing from the
    # moment it does.
    env:
      COSMIC_COVERAGE_ENV: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # The store's tests build scratch repositories and commit to
      # them. Every git call the store makes carries its own committer
      # (`-c user.email`), so no global identity is needed — but git
      # refuses to operate in a checkout it considers foreign, and the
      # runner's ownership differs from the checkout's.
      - name: trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # `bin/cosmic` fetches the one pinned cosmic, verifies its
      # sha256, and execs it; `--make ci` ends with a PASS/FAIL verdict
      # line and signals through its exit code.
      - name: gate
        run: bin/cosmic --make ci
